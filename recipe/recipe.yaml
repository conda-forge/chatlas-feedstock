schema_version: 1

context:
  version: "0.23.0"

package:
  name: chatlas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chatlas/chatlas-${{ version }}.tar.gz
  sha256: 4392b1ae91e8fb02841e5dfa70a9559a4c9a602f6dc40897fcee4f5215038446

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - requests
    - httpx
    - httpx2
    - platformdirs
    - pydantic >=2.0
    - jinja2
    - orjson
    - rich
    - openai
    - opentelemetry-api >=1.0
    - typing_extensions >=4.10

tests:
  - python:
      imports:
        - chatlas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A simple and consistent interface for chatting with LLMs
  license: MIT
  license_file: LICENSE
  homepage: https://posit-dev.github.io/chatlas
  repository: https://github.com/posit-dev/chatlas
  documentation: https://posit-dev.github.io/chatlas

extra:
  recipe-maintainers:
    - schloerke
